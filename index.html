    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Code4Ever" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!--
      Content Security Policy (hardened).
      - script-src is restricted to first-party code: no 'unsafe-eval', no wildcard https:,
        no data:/blob: script sources. ('unsafe-inline' is still required by the Vite dev
        react-refresh preamble; it is ignored by browsers whenever a nonce/hash is present.)
      - object-src/base-uri/form-action close off classic injection vectors (plugin content,
        <base> hijacking, form exfiltration). Clickjacking is covered by the
        frame-ancestors directive + X-Frame-Options sent as real headers by server.ts,
        because frame-ancestors is ignored when delivered through a <meta> tag.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.github.com https://github.com ws://localhost:* ws://127.0.0.1:*; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; script-src-elem 'self' 'unsafe-inline'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Code4Ever (C4E) - Developer Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
